name: NLCAD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Functional tests
        run: python -m pytest tests -q -m "not real_model"

      - name: Real model smoke test
        run: python -m pytest tests/test_real_inference.py -q

      - name: Model robustness
        run: python -m pytest tests/test_model_robustness.py -q -s
